name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: fully static musl builds via cargo-zigbuild.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl }
          - { os: ubuntu-latest, target: armv7-unknown-linux-musleabihf }
          - { os: ubuntu-latest, target: riscv64gc-unknown-linux-musl }
          # macOS: universal via two native builds.
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          # Windows: native x64; arm64 via cargo-xwin.
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross tooling (linux)
        if: contains(matrix.target, 'linux-musl')
        run: |
          pip install cargo-zigbuild
          cargo zigbuild --help >/dev/null

      - name: Install cross tooling (windows arm64)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: cargo install --locked cargo-xwin

      - name: Build
        shell: bash
        env:
          SKOPEO_COMMIT: ${{ github.sha }}
        run: |
          case "${{ matrix.target }}" in
            *linux-musl*)
              cargo zigbuild --release --target "${{ matrix.target }}"
              binary="target/${{ matrix.target }}/release/skopeo"
              ;;
            aarch64-pc-windows-msvc)
              cargo xwin build --release --target aarch64-pc-windows-msvc
              binary="target/aarch64-pc-windows-msvc/release/skopeo.exe"
              ;;
            *)
              cargo build --release --target "${{ matrix.target }}"
              binary="target/${{ matrix.target }}/release/skopeo"
              if [[ "${{ matrix.target }}" == *windows* ]]; then
                binary="${binary}.exe"
              fi
              ;;
          esac
          name="skopeo-${{ matrix.target }}"
          [[ "$binary" == *.exe ]] && name="${name}.exe"
          cp "$binary" "$name"
          echo "ARTIFACT=$name" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARTIFACT }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
